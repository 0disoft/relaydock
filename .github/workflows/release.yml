name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without a leading v
        required: true
        type: string

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Fail closed on incomplete release inputs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: go run ./cmd/releasepack readiness --root . --version "$VERSION"
      - name: Enforce repository file-size policy
        run: go run ./cmd/releasepack audit --root .
      - name: Test non-desktop core
        shell: bash
        run: |
          go list ./internal/... ./tests/... | grep -v '/internal/desktopwails$' > /tmp/test-packages.txt
          xargs go test -race < /tmp/test-packages.txt
      - run: bun install --frozen-lockfile
      - run: bun run --cwd frontend test && bun run --cwd frontend check
      - run: bun run --cwd web/control-console check

  contracts:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Validate generated contracts
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 lint
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 generate
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          go test ./gen/go/... ./internal/persistence/postgres/sqlcgen/...
      - name: Archive generated contracts
        shell: bash
        run: |
          mkdir -p dist/contracts
          cp -R gen/go dist/contracts/protobuf-go
          cp -R internal/persistence/postgres/sqlcgen dist/contracts/sqlc-go
          tar -czf dist/generated-contracts-${{ needs.validate.outputs.version }}.tar.gz -C dist/contracts .
          sha256sum dist/generated-contracts-*.tar.gz > dist/generated-contracts-SHA256SUMS
      - name: Generate generated-contracts SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: dist/contracts
          format: spdx-json
          output-file: dist/generated-contracts-SBOM.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Attest generated contracts
        uses: actions/attest@v4
        with:
          subject-checksums: dist/generated-contracts-SHA256SUMS
      - name: Attest generated-contracts SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/generated-contracts-SHA256SUMS
          sbom-path: dist/generated-contracts-SBOM.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: generated-contracts
          path: |
            dist/generated-contracts-*.tar.gz
            dist/generated-contracts-SHA256SUMS
            dist/generated-contracts-SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14

  postgres-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: airuntime
          POSTGRES_PASSWORD: airuntime
          POSTGRES_DB: airuntime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airuntime -d airuntime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARG_TEST_POSTGRES_URL: postgres://airuntime:airuntime@127.0.0.1:5432/airuntime?sslmode=disable
      ARG_TEST_POSTGRES_ALLOW_RESET: I_UNDERSTAND_THIS_DATABASE_WILL_BE_TRUNCATED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Exercise migration and durable delivery contracts
        run: go test -tags=integration -count=1 -timeout=2m ./tests/postgres

  source-archive:
    needs: [validate, contracts, postgres-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build deterministic source archive
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p dist
          generated_at="$(git show -s --format=%cI HEAD)"
          go run ./cmd/releasepack build --root . --output "$RUNNER_TEMP/relaydock-$VERSION-source.zip" --generated-at "$generated_at"
          go run ./cmd/releasepack verify --root .
          cp "$RUNNER_TEMP/relaydock-$VERSION-source.zip" dist/
          (cd dist && sha256sum *.zip > SHA256SUMS-source)
      - name: Generate source SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/source-SBOM.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Attest source archive
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS-source
      - name: Attest source SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS-source
          sbom-path: dist/source-SBOM.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: |
            dist/relaydock-*-source.zip
            dist/SHA256SUMS-source
            dist/source-SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14


  server-binaries:
    needs: [validate, contracts, postgres-integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build headless services
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.validate.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p dist
          commit="${GITHUB_SHA}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/0disoft/relaydock/internal/buildinfo.Version=${VERSION} -X github.com/0disoft/relaydock/internal/buildinfo.Commit=${commit} -X github.com/0disoft/relaydock/internal/buildinfo.BuildTime=${built_at}"
          for command in gatewayd controld expert-brokerd outboxd headless mcp-bridge dbmigrate projectctl keyctl controlctl mcptokenctl outboxctl webhook-sink expertstorectl releasepack; do
            extension=""
            if [[ "$GOOS" == windows ]]; then extension=".exe"; fi
            go build -trimpath -ldflags "$ldflags" -o "dist/${command}-${SUFFIX%.*}${extension}" "./cmd/${command}"
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Generate server SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/server-${{ matrix.suffix }}-SBOM.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Attest server binaries
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest server SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/server-${{ matrix.suffix }}-SBOM.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  web-assets:
    needs: [validate, contracts, postgres-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd frontend build
      - run: bun run --cwd web/control-console build
      - name: Archive web assets
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/desktop-frontend-${{ needs.validate.outputs.version }}.tar.gz -C frontend dist
          tar -czf dist/control-console-${{ needs.validate.outputs.version }}.tar.gz -C web/control-console build
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/web-SBOM.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Attest web assets
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest web SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/web-SBOM.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  container-images:
    needs: [validate, contracts, postgres-integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            dockerfile: deploy/docker/Dockerfile.gateway
          - component: control
            dockerfile: deploy/docker/Dockerfile.control
          - component: expert
            dockerfile: deploy/docker/Dockerfile.expert
          - component: outbox
            dockerfile: deploy/docker/Dockerfile.outbox
          - component: ops
            dockerfile: deploy/docker/Dockerfile.ops
          - component: webhook-sink
            dockerfile: deploy/docker/Dockerfile.webhook-sink
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Docker Buildx action
        uses: docker/setup-buildx-action@v4.1.0
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0
      - id: image_metadata
        name: Resolve immutable image inputs
        shell: bash
        run: echo "build_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        name: Build OCI image archive without publishing
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/relaydock-${{ matrix.component }}-${{ needs.validate.outputs.version }}-linux-amd64.oci.tar
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.image_metadata.outputs.build_time }}
      - name: Record OCI archive and image digest
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid OCI image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi
          mkdir -p dist
          archive="relaydock-$COMPONENT-$VERSION-linux-amd64.oci.tar"
          cp "$RUNNER_TEMP/$archive" "dist/$archive"
          printf '%s  %s\n' "$IMAGE_DIGEST" "$archive" > "dist/IMAGE-DIGEST-$COMPONENT"
          (cd dist && sha256sum "$archive" > SHA256SUMS-container)
      - name: Generate container SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          file: dist/relaydock-${{ matrix.component }}-${{ needs.validate.outputs.version }}-linux-amd64.oci.tar
          format: spdx-json
          output-file: dist/container-${{ matrix.component }}-SBOM.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Attest OCI archive
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS-container
      - name: Attest container SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS-container
          sbom-path: dist/container-${{ matrix.component }}-SBOM.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.component }}-linux-amd64
          path: |
            dist/relaydock-*.oci.tar
            dist/IMAGE-DIGEST-*
            dist/SHA256SUMS-container
            dist/container-*-SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14


  windows-desktop:
    needs: [validate, contracts, postgres-integration]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
      - name: Build Windows desktop bundle
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          bun install --frozen-lockfile
          wails3 generate bindings
          bun run --cwd frontend test
          bun run --cwd frontend check
          bun run --cwd frontend build
          New-Item -ItemType Directory -Force -Path bin,dist | Out-Null
          $builtAt = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $ldflags = "-s -w -H windowsgui -X github.com/0disoft/relaydock/internal/buildinfo.Version=$env:VERSION -X github.com/0disoft/relaydock/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/0disoft/relaydock/internal/buildinfo.BuildTime=$builtAt"
          go build -trimpath -tags production -ldflags $ldflags -o bin/relaydock.exe .
          $bridgeFlags = "-s -w -X github.com/0disoft/relaydock/internal/buildinfo.Version=$env:VERSION -X github.com/0disoft/relaydock/internal/buildinfo.Commit=$env:GITHUB_SHA -X github.com/0disoft/relaydock/internal/buildinfo.BuildTime=$builtAt"
          go build -trimpath -ldflags $bridgeFlags -o bin/mcp-bridge.exe ./cmd/mcp-bridge
          $stage = "dist/relaydock-$env:VERSION-windows-amd64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item bin/relaydock.exe,bin/mcp-bridge.exe,README.md,LICENSE,NOTICE -Destination $stage
          $archive = "$stage.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -NoNewline -Encoding ascii "dist/SHA256SUMS-windows-desktop"
      - name: Generate Windows desktop SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/windows-desktop-SBOM.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false
      - name: Attest Windows desktop bundle
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS-windows-desktop
      - name: Attest Windows desktop SBOM
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS-windows-desktop
          sbom-path: dist/windows-desktop-SBOM.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: |
            dist/relaydock-*-windows-amd64.zip
            dist/SHA256SUMS-windows-desktop
            dist/windows-desktop-SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14

  sign-release-checksums:
    needs: [validate, contracts, source-archive, server-binaries, web-assets, container-images, windows-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Download release-candidate artifacts only
        uses: actions/download-artifact@v4
        with:
          pattern: "!*.dockerbuild"
          path: dist/release-inputs
      - name: Sign and verify every release checksum file
        shell: bash
        env:
          RELAYDOCK_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELAYDOCK_RELEASE_SIGNING_PRIVATE_KEY }}
          RELAYDOCK_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELAYDOCK_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          mapfile -t checksum_files < <(find dist/release-inputs -type f -name '*SHA256SUMS*' -print | sort)
          if [[ "${#checksum_files[@]}" -ne 14 ]]; then
            echo "expected 14 release checksum files, found ${#checksum_files[@]}" >&2
            exit 1
          fi
          for checksum_file in "${checksum_files[@]}"; do
            relative="${checksum_file#dist/release-inputs/}"
            artifact_name="${relative%%/*}"
            signature="dist/release-signatures/$artifact_name/$(basename "$checksum_file").sig.json"
            go run ./cmd/releasepack sign-checksums --input "$checksum_file" --output "$signature"
            go run ./cmd/releasepack verify-checksums --input "$checksum_file" --signature "$signature"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-signatures
          path: dist/release-signatures/
          if-no-files-found: error
          retention-days: 14
