name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          mapfile -d '' files < <(find . -name '*.go' -type f -not -path './gen/*' -print0)
          test -z "$(gofmt -l "${files[@]}")"
      - name: Enforce repository file-size policy
        run: go run ./cmd/releasepack audit --root .
      - name: Resolve non-desktop packages
        id: packages
        shell: bash
        run: |
          go list ./internal/... ./tests/... | grep -v '/internal/desktopwails$' > /tmp/test-packages.txt
          go list ./cmd/... ./internal/... | grep -v '/internal/desktopwails$' > /tmp/vet-packages.txt
      - name: Test core and integration packages
        shell: bash
        run: xargs go test -race < /tmp/test-packages.txt
      - name: Vet commands and core packages
        shell: bash
        run: xargs go vet < /tmp/vet-packages.txt


  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Validate protobuf contracts
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 lint
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 generate
      - name: Validate SQL contracts against the final schema snapshot
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - name: Compile generated contracts
        run: go test ./gen/go/... ./internal/persistence/postgres/sqlcgen/...

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: airuntime
          POSTGRES_PASSWORD: airuntime
          POSTGRES_DB: airuntime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airuntime -d airuntime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARG_TEST_POSTGRES_URL: postgres://airuntime:airuntime@127.0.0.1:5432/airuntime?sslmode=disable
      ARG_TEST_POSTGRES_ALLOW_RESET: I_UNDERSTAND_THIS_DATABASE_WILL_BE_TRUNCATED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Exercise migrations, runtime journal, and outbox leases
        run: go test -tags=integration -count=1 -timeout=2m ./tests/postgres

  desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun --cwd frontend run test
      - run: bun --cwd frontend run check

  control-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun --cwd web/control-console run check

  desktop-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
      - name: Build desktop frontend and bindings
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          wails3 generate bindings
          bun --cwd frontend run test
          bun --cwd frontend run check
          bun --cwd frontend run build
      - name: Compile Windows desktop and MCP bridge
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -trimpath -tags production -ldflags "-s -w -H windowsgui" -o bin/relaydock.exe .
          go build -trimpath -ldflags "-s -w" -o bin/mcp-bridge.exe ./cmd/mcp-bridge
