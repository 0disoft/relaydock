version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Public proto paths intentionally omit the airuntime package prefix.
    - PACKAGE_DIRECTORY_MATCH
    # Preserve the published RuntimeSnapshotChunk streaming response type.
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
