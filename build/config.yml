info:
  productName: "AI Runtime Gateway"
  productIdentifier: "dev.zerodi.airuntime"
  productVersion: "0.5.0"
  companyName: "ZeroD"
  productDescription: "Local AI routing and expert escalation runtime"
  copyright: "Copyright © 2026"

protocols:
  - scheme: airuntime
    description: "AI Runtime Gateway deep link"

windows:
  installer:
    installScope: user

linux:
  categories:
    - Development
    - Utility

dev_mode:
  debounce: 250
  ignore:
    dirs:
      - .git
      - bin
      - data
      - gen
      - node_modules
    extensions:
      - .md
      - .log
