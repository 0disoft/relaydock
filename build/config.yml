info:
  productName: "RelayDock"
  productIdentifier: "com.0disoft.relaydock"
  productVersion: "0.5.2"
  companyName: "0disoft"
  productDescription: "Local AI routing and expert escalation runtime"
  copyright: "Copyright © 2026"

protocols:
  - scheme: airuntime
    description: "RelayDock deep link"

windows:
  installer:
    installScope: user

linux:
  categories:
    - Development
    - Utility

dev_mode:
  debounce: 250
  ignore:
    dirs:
      - .git
      - bin
      - data
      - gen
      - node_modules
    extensions:
      - .md
      - .log
