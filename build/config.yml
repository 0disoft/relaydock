info:
  productName: "RelayDock"
  productIdentifier: "com.0disoft.relaydock"
  productVersion: "0.5.13"
  companyName: "0disoft"
  productDescription: "Local AI routing and expert escalation runtime"
  copyright: "Copyright © 2026"

protocols:
  - scheme: airuntime
    description: "RelayDock deep link"

windows:
  installer:
    installScope: user

linux:
  categories:
    - Development
    - Utility

dev_mode:
  root_path: .
  debounce: 250
  ignore:
    dir:
      - .git
      - bin
      - data
      - gen
      - node_modules
      - frontend
      - web
    file:
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task dev:build
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task dev:run
      type: primary
